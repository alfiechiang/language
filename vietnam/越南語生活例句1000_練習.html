const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
D.forEach(d=>d.k=strip(d[2])+' '+d[3]);
let cat=-1,list=D.slice(),shuffled=false;
const au=new Audio();let queue=[],cur=null;
const pad=n=>String(n).padStart(4,'0');
function play(d,el){au.src='audio/phrases/'+pad(d[0])+'.mp3';au.play();document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));if(el){el.classList.add('playing');}cur=el;}
au.onended=()=>{if(queue.length){const [d,el]=queue.shift();el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>play(d,el),500);}else{pa.textContent='▶ 連續播放';}};
function render(){const q=strip(document.getElementById('q').value.trim());
 let v=list.filter(d=>(cat<0||d[1]===cat)&&(!q||d.k.includes(q)));
 const g=document.getElementById('grid');g.innerHTML='';
 document.getElementById('count').textContent=`顯示 ${v.length} 句`+(cat>=0?`（${CATS[cat]}）`:'');
 const fr=document.createDocumentFragment();
 v.forEach(d=>{const e=document.createElement('div');e.className='w';
  e.innerHTML=`<span class="spk">🔊</span><div class="vi"></div><div class="zh"></div><div class="meta">#${d[0]}・${CATS[d[1]]}</div>`;
  e.querySelector('.vi').textContent=d[2];e.querySelector('.zh').textContent=d[3];
  e.onclick=()=>{queue=[];pa.textContent='▶ 連續播放';play(d,e)};e._d=d;fr.appendChild(e)});
 g.appendChild(fr);}
const chips=document.getElementById('chips');
function mk(label,i,n){const b=document.createElement('button');b.className='chip'+(i===cat?' on':'');b.innerHTML=label+`<small>${n}</small>`;b.onclick=()=>{cat=i;[...chips.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');render()};chips.appendChild(b)}
mk('全部',-1,D.length);CATS.forEach((c,i)=>mk(c,i,D.filter(d=>d[1]===i).length));
document.getElementById('q').oninput=render;
const pa=document.getElementById('playall');
pa.onclick=()=>{if(queue.length||!au.paused){queue=[];au.pause();pa.textContent='▶ 連續播放';return}
 const els=[...document.querySelectorAll('.w')];if(!els.length)return;queue=els.map(e=>[e._d,e]);const [d,el]=queue.shift();pa.textContent='■ 停止';play(d,el)};
document.getElementById('hz').onclick=e=>{document.body.classList.toggle('hide-zh');e.target.classList.toggle('on')};
document.getElementById('hv').onclick=e=>{document.body.classList.toggle('hide-vi');e.target.classList.toggle('on')};
document.getElementById('shuf').onclick=e=>{shuffled=!shuffled;e.target.classList.toggle('on');list=shuffled?D.slice().sort(()=>Math.random()-.5):D.slice();render()};
render();
